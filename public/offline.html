<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Offline</title>
<style>
  :root { --bg: #ffffff; --fg: #0d0d0d; --muted: #5d5d5d; --btn-bg: #0d0d0d; --btn-fg: #ffffff; --ring: #8f8f8f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #212121; --fg: #ececec; --muted: #b4b4b4; --btn-bg: #ececec; --btn-fg: #0d0d0d; --ring: #8f8f8f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); }
  button {
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    padding: 10px 20px; border: 0; border-radius: 9999px;
    background: var(--btn-bg); color: var(--btn-fg);
  }
  button:hover { opacity: .85; }
  button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1 id="t">You're offline</h1>
  <p id="m">Check your connection, then reconnect to keep chatting.</p>
  <button id="b" type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  if ((navigator.language || "").toLowerCase().indexOf("de") === 0) {
    document.documentElement.lang = "de";
    document.title = "Offline";
    document.getElementById("t").textContent = "Du bist offline";
    document.getElementById("m").textContent = "Prüfe deine Verbindung und verbinde dich erneut, um weiterzuchatten.";
    document.getElementById("b").textContent = "Erneut versuchen";
  }
  // Come back on its own once the network returns.
  addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
